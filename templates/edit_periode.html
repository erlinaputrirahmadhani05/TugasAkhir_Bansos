{% extends "dashboard.html" %}

{% block page_title %}
Edit Periode
{% endblock %}

{% block breadcrumb %}
{% endblock %}

{% block content %}

<div class="content-card">
    <form method="POST">

        <div class="form-group">
            <label>Tahun</label>
            <input type="number"
                   name="tahun"
                   value="{{ periode.tahun }}"
                   required>
        </div>

        <div class="form-group">
            <label>Tahap</label>

            <select name="tahap" required>

                <option value="1"
                    {% if periode.tahap == 1 %}selected{% endif %}>
                    Tahap 1
                </option>

                <option value="2"
                    {% if periode.tahap == 2 %}selected{% endif %}>
                    Tahap 2
                </option>

                <option value="3"
                    {% if periode.tahap == 3 %}selected{% endif %}>
                    Tahap 3
                </option>

                <option value="4"
                    {% if periode.tahap == 4 %}selected{% endif %}>
                    Tahap 4
                </option>

            </select>

        </div>

        <button type="submit" class="btn-submit">
            Simpan Perubahan
        </button>

    </form>
</div>

{% endblock %}
